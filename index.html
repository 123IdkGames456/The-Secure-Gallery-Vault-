<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Secure Gallery Vault</title>
<style>
:root{color-scheme:dark;--bg:#08090c;--panel:#12151c;--line:#292e39;--text:#f4f5f8;--muted:#9ba3b3;--accent:#b9a4ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{width:min(420px,calc(100% - 32px));margin:12vh auto 0;padding:28px;background:linear-gradient(145deg,#191c26,#101218);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 90px #0008}
.brand{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:800;margin-bottom:18px}
h1{font-size:clamp(25px,5vw,34px);line-height:1.12;margin:0 0 9px}
p{color:var(--muted);margin:0 0 22px}
label{display:block;color:#c8ccda;font-size:13px;margin:15px 0 7px}
input{width:100%;padding:14px 15px;border:1px solid #343a48;border-radius:12px;background:#090b10;color:white;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #b9a4ff20}
button.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#171321;font-weight:800}
.status{min-height:22px;margin-top:14px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.status.error{color:#ff9292}
#galleryView{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #222630;background:#0b0d12}
.topbrand{font-weight:800;letter-spacing:.08em;font-size:13px}.topbrand span{color:var(--accent)}
.counter{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.topbtn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#171a22;color:var(--text);font-size:12px}
.stage{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:76px minmax(0,1fr) 76px;align-items:center;padding:18px;gap:12px}
.nav{width:52px;height:52px;border:1px solid #343947;border-radius:50%;background:#171b25;color:white;font-size:28px;display:grid;place-items:center;justify-self:center;transition:.18s}
.nav:hover:not(:disabled){background:#282d3b;border-color:var(--accent);transform:scale(1.05)}
.nav:disabled{opacity:.22;cursor:default}
.slots{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr) minmax(0,1fr);gap:14px;align-items:center}
.slot{height:min(100%,680px);min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #242936;border-radius:18px;background:radial-gradient(ellipse,#161a23,#0b0d12);opacity:.48;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:contain}
.slot.center{opacity:1;border-color:#41485a;box-shadow:0 20px 70px #0008;cursor:zoom-in}
.slot.center img{object-fit:contain}
.slot.empty{visibility:hidden}
.bottom{height:54px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;border-top:1px solid #222630}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
#empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
#lightbox{position:fixed;inset:0;z-index:10;background:#030407f5;display:flex;align-items:center;justify-content:center;padding:58px 70px}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#lightboxClose{position:absolute;top:14px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid #454b59;background:#151923;color:white;font-size:23px}
#lightboxPrev,#lightboxNext{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #454b59;background:#151923;color:white;font-size:25px}
#lightboxPrev{left:14px}#lightboxNext{right:14px}
#lightboxCount{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#c5c9d3;font-size:13px}
@media(max-width:700px){
 .topbar{height:54px;padding:0 12px}.topbrand{font-size:11px}.topbtn{padding:7px 9px}
 .stage{grid-template-columns:42px minmax(0,1fr) 42px;padding:8px 4px;gap:2px}
 .slots{display:block;position:relative;width:100%;height:100%}
 .slot{display:none!important}
 .slot.center{display:flex!important;width:100%;height:100%;border-radius:12px}
 .nav{width:38px;height:38px;font-size:22px}
 .bottom{height:42px}
 #lightbox{padding:58px 48px}
 #lightboxPrev{left:5px}#lightboxNext{right:5px}
}
</style>
</head>
<body>
<section id="login">
 <div class="brand">◈ SECURE GALLERY VAULT</div>
 <h1>Open your gallery</h1>
 <p>Enter your master password and room code to view your images.</p>
 <form id="loginForm">
  <label for="password">Master password</label><input id="password" type="password" autocomplete="current-password" required>
  <label for="roomCode">Room code</label><input id="roomCode" autocomplete="off" autocapitalize="characters" required>
  <button class="primary" id="openBtn" type="submit">Open gallery</button>
 </form>
 <div class="status" id="loginStatus" role="status"></div>
</section>
<section id="galleryView" class="hidden">
 <header class="topbar"><div class="topbrand">◈ <span>SECURE</span> GALLERY</div><div class="counter" id="count">0 images</div><button class="topbtn" id="changeRoom">Change room</button></header>
 <div class="stage" id="stage">
  <button class="nav" id="prev" aria-label="Previous image">‹</button>
  <div class="slots" id="slots">
   <div class="slot" id="leftSlot"></div><div class="slot center" id="centerSlot"></div><div class="slot" id="rightSlot"></div>
  </div>
  <button class="nav" id="next" aria-label="Next image">›</button>
  <div id="empty" class="hidden">No images in this room yet.</div>
 </div>
 <footer class="bottom"><span class="dot"></span><span id="filename">Your private gallery</span></footer>
</section>
<div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Fullscreen image">
 <button id="lightboxClose" aria-label="Close">×</button><button id="lightboxPrev" aria-label="Previous image">‹</button><img id="largeImage" alt=""><button id="lightboxNext" aria-label="Next image">›</button><div id="lightboxCount"></div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxL8enxViK6dad3UCrFvzRVoHFd-5sBFuQ19SdIgFUvXs9iyvPekQqkfHEPPSZYNUcawA/exec";
const $=id=>document.getElementById(id);
let masterPassword="",roomCode="",images=[],imageUrls=[],index=0;
async function api(action,extra={}){
 const response=await fetch(API_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,masterPassword,roomCode,...extra})});
 let data;try{data=await response.json()}catch{throw new Error("The gallery service returned an invalid response.")}
 if(!data.ok)throw new Error(data.error||"Request failed.");
 return data;
}
function status(text,error=false){$("loginStatus").textContent=text;$("loginStatus").className="status"+(error?" error":"")}
function makeImage(item,data){return "data:"+data.mimeType+";base64,"+data.base64}
async function openGallery(){
 const check=await api("checkMaster");
 const list=await api("listImages");
 images=(list.images||[]).map(x=>({...x,id:x.id||x.imageId,name:x.name||x.fileName||"Image"}));
 imageUrls=await Promise.all(images.map(async item=>{
  const data=await api("getImage",{imageId:item.id});
  return makeImage(item,data);
 }));
 index=0;
 $("login").classList.add("hidden");$("galleryView").classList.remove("hidden");
 render();
}
function slot(id,at){
 const el=$(id);el.replaceChildren();
 if(at<0||at>=images.length){el.classList.add("empty");return}
 el.classList.remove("empty");
 const img=document.createElement("img");img.src=imageUrls[at];img.alt=images[at].name;
 el.append(img);
 if(id!=="centerSlot")el.onclick=()=>{index=at;render()};
 else el.onclick=()=>openLightbox();
}
function render(){
 const n=images.length;
 $("count").textContent=n+" image"+(n===1?"":"s");
 $("prev").disabled=index<=0;$("next").disabled=index>=n-1;
 $("slots").classList.toggle("hidden",n===0);$("empty").classList.toggle("hidden",n!==0);
 if(n){slot("leftSlot",index-1);slot("centerSlot",index);slot("rightSlot",index+1);$("filename").textContent=images[index].name+" · "+(index+1)+" / "+n}
 else $("filename").textContent="Empty gallery";
}
function move(step){index=Math.max(0,Math.min(images.length-1,index+step));render();if(!$("lightbox").classList.contains("hidden"))renderLightbox()}
function openLightbox(){$("lightbox").classList.remove("hidden");renderLightbox()}
function closeLightbox(){$("lightbox").classList.add("hidden")}
function renderLightbox(){if(!images.length)return;$("largeImage").src=imageUrls[index];$("largeImage").alt=images[index].name;$("lightboxCount").textContent=images[index].name+" · "+(index+1)+" / "+images.length;$("lightboxPrev").disabled=index===0;$("lightboxNext").disabled=index===images.length-1}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();$("openBtn").disabled=true;status("Connecting to your gallery…");
 masterPassword=$("password").value;roomCode=$("roomCode").value.trim();
 try{await openGallery();status("")}catch(err){status(err.message,true)}
 finally{$("openBtn").disabled=false}
});
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("lightboxPrev").onclick=()=>move(-1);$("lightboxNext").onclick=()=>move(1);
$("lightboxClose").onclick=closeLightbox;
$("changeRoom").onclick=()=>{closeLightbox();masterPassword="";roomCode="";images=[];imageUrls=[];$("password").value="";$("roomCode").value="";$("galleryView").classList.add("hidden");$("login").classList.remove("hidden");status("")};
document.addEventListener("keydown",e=>{
 if(!$("lightbox").classList.contains("hidden")){
  if(e.key==="Escape")closeLightbox();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);
 }else if(!$("galleryView").classList.contains("hidden")){
  if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);
 }
});
let touchX=0;
$("stage").addEventListener("touchstart",e=>{touchX=e.changedTouches[0].screenX},{passive:true});
$("stage").addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>55)move(dx<0?1:-1)},{passive:true});
</script>
</body>
</html>
