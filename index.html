
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Image Gallery</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #151515;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { text-align: center; }
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
  gap: 12px;
}
.gallery iframe {
  width: 100%;
  height: 220px;
  border: 0;
  border-radius: 10px;
}
</style>
</head>
<body>
<h1>Image Gallery</h1>
<div class="gallery">
  <iframe
    src="https://drive.google.com/embeddedfolderview?id=1X0xvdegbPGvJvSmWzazES1O-sn-x3rVe#grid">
  </iframe>
</div>
</body>
</html>
