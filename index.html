<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0f">
<title>Secure Gallery</title>
<link rel="stylesheet" href="assets/style.css">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden}
#galleryFrame{display:none;width:100%;height:100%;height:100dvh;border:0;background:#090a0f}
body.gallery-open{background:#090a0f}
body.gallery-open .login-panel{display:none}
body.gallery-open #galleryFrame{display:block}
</style>
</head>
<body class="login-page">
<main class="login-panel">
<h1>◈ SECURE GALLERY</h1>
<p>Enter the password to continue.</p>
<form id="loginForm">
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
<button class="header-btn" type="submit">Enter gallery</button>
<p id="loginError" role="alert" aria-live="polite"></p>
</form>
</main>
<iframe id="galleryFrame" title="Secure Gallery" allow="autoplay; fullscreen"></iframe>
<script src="assets/auth.js"></script>
<script>
function showGallery(){
  document.body.classList.add("gallery-open");
  document.getElementById("galleryFrame").src="images.html";
}
setupLogin();
if(sessionStorage.getItem("secureGalleryLoggedIn")==="true")showGallery();
</script>
</body>
</html>
