<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Images</title>
<style>
:root{color-scheme:dark;--bg:#090a0f;--panel:#141722;--line:#292f3d;--muted:#9ca5b7;--accent:#b9a4ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:#f5f6fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow-x:hidden}
header{height:62px;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:0 20px;background:#0d0f15ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
h1{font-size:14px;letter-spacing:.13em;margin:0;font-weight:850}h1 span{color:var(--accent)}
#total{margin-left:auto;color:var(--muted);font-size:13px}
.header-btn{border:1px solid var(--line);border-radius:10px;background:#191d28;color:#e8eaf1;padding:8px 11px;font:inherit;font-size:12px;font-weight:650;white-space:nowrap;cursor:pointer}.header-btn:hover{background:#242a39;border-color:#555d70}.header-btn:active{transform:scale(.97)}
.hide-toggle{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:#191d28;color:#e8eaf1;font-size:12px;white-space:nowrap}.hide-toggle input{width:17px;height:17px;margin:0;accent-color:#b9a4ff;cursor:pointer}#total{margin-left:auto}
.tabbar{display:flex;gap:8px;padding:12px 18px 0;max-width:1200px;margin:0 auto}.tab-btn{border:1px solid var(--line);border-radius:10px 10px 0 0;background:#11141d;color:var(--muted);padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tab-btn.active{background:#1b2030;color:#fff;border-color:#424b60;border-bottom-color:#b9a4ff}.section-title{width:min(1200px,100%);margin:18px auto 0;padding:0 18px;color:#dfe2ec;font-size:15px;font-weight:750}.media-grid{width:min(1200px,100%);margin:0 auto;padding:14px 18px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.help-panel{width:min(1164px,calc(100% - 36px));margin:14px auto 4px;padding:16px 18px;background:#141722;border:1px solid #353c50;border-radius:14px;color:#dfe2ec;font-size:13px;line-height:1.65}.help-panel h3{margin:0 0 8px;font-size:15px;color:#fff}.help-panel ol{margin:8px 0 12px;padding-left:22px}.help-panel p{margin:8px 0;color:#b9c1d1}.help-panel strong{color:#fff}.media-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#141722;padding:10px}.media-card img,.media-card video{display:block;width:100%;max-height:560px;object-fit:contain;border-radius:9px;background:#080a10}.media-card a{display:block;color:#c8b8ff;overflow-wrap:anywhere;padding:12px;font-size:13px}.video-actions{display:flex;flex-wrap:wrap;gap:8px}.video-actions a{padding:9px 10px;border:1px solid var(--line);border-radius:9px;text-decoration:none;background:#10131b}.media-card .media-name{color:var(--muted);font-size:12px;padding:8px 3px 2px;overflow-wrap:anywhere}.hidden-section{display:none!important}
#status,#mediaStatus{padding:18px 20px;color:var(--muted);text-align:center;font-size:14px}.delivery-status{width:min(1164px,calc(100% - 36px));margin:14px auto 0;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:#141722;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}.delivery-status strong{color:#fff}.delivery-status span{color:#b9c1d1}.delivery-status .good{color:#9ee2b0}.delivery-status .warn{color:#ffd28a}
#grid{width:min(1200px,100%);margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{min-width:0;aspect-ratio:1/1;background:linear-gradient(145deg,#191d29,#10131b);border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;position:relative}
.tile img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .2s}.hide-images .tile img{filter:blur(24px) brightness(.55);transform:scale(1.12)}
.tile:hover img{transform:scale(1.035)}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 9px;background:linear-gradient(transparent,#000b);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer{position:fixed;inset:0;z-index:5;background:#030408f7;display:flex;align-items:center;justify-content:center;padding:60px 72px}
#viewer.hidden{display:none}
#big{max-width:100%;max-height:100%;object-fit:contain}
.vbtn{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid #454b5a;background:#171b26;color:white;font-size:25px;display:grid;place-items:center}
#close{top:14px;right:16px;font-size:27px}#prev{left:14px;top:50%;transform:translateY(-50%)}#next{right:14px;top:50%;transform:translateY(-50%)}
#caption{position:absolute;bottom:16px;left:10px;right:10px;text-align:center;color:#c5cad5;font-size:13px}#login{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top,#202438,#090a0f 65%);display:flex;align-items:center;justify-content:center;padding:20px}#login.hidden{display:none}.login-card{width:min(380px,100%);padding:28px;background:#141722;border:1px solid #303748;border-radius:20px;box-shadow:0 20px 80px #0008;text-align:center}.login-card h2{margin:0 0 8px;font-size:21px}.login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}.login-card input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #353c4d;background:#0b0e15;color:#fff;font:inherit;outline:none}.login-card button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:11px;background:#b9a4ff;color:#171222;font-weight:800;font:inherit;cursor:pointer}.login-error{min-height:20px;margin-top:10px;color:#ff9292;font-size:12px}
@media(max-width:700px){header{height:54px;padding:0 12px}.tabbar{padding:9px 10px 0}.media-grid{grid-template-columns:1fr;padding:10px}.section-title{padding:0 10px}#grid{padding:10px;gap:8px}.tile{border-radius:10px}.tile span{font-size:10px;padding:18px 7px 7px}#viewer{padding:56px 48px}#prev{left:5px}#next{right:5px}}
@media(max-width:360px){#grid{gap:6px;padding:7px}}
</style>
</head>
<body>
<header><h1><span>◈</span> IMAGES</h1><button class="header-btn" id="randomImage" type="button">↝ Random</button><div id="total">Laster…</div><label class="hide-toggle" for="hideImages"><span>Hide images</span><input id="hideImages" type="checkbox"></label></header>
<section id="deliveryStatus" class="delivery-status" aria-live="polite"><strong>Connection status</strong><span id="deliverySummary">Checking Google Drive…</span></section>
<nav class="tabbar" aria-label="Gallery tabs"><button class="tab-btn active" id="imagesTab" type="button">Images</button><button class="tab-btn" id="videosTab" type="button">MP4 Videos</button></nav>
<div id="imagesSection"><div id="status">Henter bilder…</div><section id="grid" aria-label="Bildegalleri"></section></div>
<div id="videosSection" class="hidden-section"><h2 class="section-title">MP4 Videos</h2><div id="videoStatus" class="status">Loading videos…</div><section id="videoGrid" class="media-grid" aria-label="Videos"></section></div>
<div id="login" role="dialog" aria-modal="true" aria-label="Passord"><form class="login-card" id="loginForm"><h2>◈ Secure Gallery</h2><p>Skriv inn passord for å åpne galleriet</p><input id="password" type="password" placeholder="Passord" autocomplete="current-password" required><button type="submit">Åpne galleri</button><div class="login-error" id="loginError"></div></form></div>
<div id="viewer" class="hidden" role="dialog" aria-modal="true" aria-label="Bildevisning">
<button class="vbtn" id="close" aria-label="Lukk">×</button>
<button class="vbtn" id="prev" aria-label="Forrige">‹</button>
<img id="big" alt="">
<button class="vbtn" id="next" aria-label="Neste">›</button>
<div id="caption"></div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycby2U4rxm0a75fq-jZan2ar61JfqZWxC7yhj5EJT-sPA9ZyD-MkEKdMqdB4A8WVJTzB4/exec";
const $=id=>document.getElementById(id);
let images=[],videos=[],current=0,activeTab="images";const PASSWORD_HASH="c8cf49ca3d8f0a884e24389c9e7090c22f09f63d1b6b9e6c0b2376ad64d4dd3f";const HIDE_KEY="secureGalleryHideImages";
function applyHideSetting(){const enabled=localStorage.getItem(HIDE_KEY)==="true";$("hideImages").checked=enabled;document.body.classList.toggle("hide-images",enabled)}
function load(){
 $("status").textContent="Henter bilder…";$("grid").replaceChildren();$("total").textContent="…";
 const callback="galleryCallback";
 const old=document.getElementById("galleryApi");if(old)old.remove();
 const script=document.createElement("script");script.id="galleryApi";
 script.src=API+"?callback="+callback+"&t="+Date.now();
 script.onerror=()=>{$("status").textContent="Kunne ikke hente bildene. Sjekk at Apps Script er publisert som Web app med tilgang for alle.";};
 window[callback]=data=>{
  script.remove();
  if(!data||!data.ok){$("status").textContent=(data&&data.error)||"Kunne ikke hente bildene.";return;}
  images=Array.isArray(data.images)?data.images:[];
  videos=Array.isArray(data.videos)?data.videos:[];
  const counts=data.counts||{};
  const delivery=data.delivery||{};
  const imageCount=Number.isFinite(counts.images)?counts.images:images.length;
  const videoCount=Number.isFinite(counts.videos)?counts.videos:videos.length;
  const shareImages=Number.isFinite(counts.imagesAvailableToClient)?counts.imagesAvailableToClient:images.filter(x=>x.canSendToClient).length;
  const shareVideos=Number.isFinite(counts.videosAvailableToClient)?counts.videosAvailableToClient:videos.filter(x=>x.canSendToClient).length;
  const imageReady=typeof delivery.canSendImagesToClient==="boolean"?delivery.canSendImagesToClient:(imageCount>0&&shareImages===imageCount);
  const videoReady=typeof delivery.canSendVideosToClient==="boolean"?delivery.canSendVideosToClient:(videoCount>0&&shareVideos===videoCount);
  $("deliverySummary").innerHTML="";
  const statusText=document.createElement("span");
  statusText.textContent="Images: "+imageCount+" total · "+shareImages+" shareable · "+(imageReady?"sharing ready":"sharing issue");
  statusText.className=imageReady?"good":"warn";
  const videoText=document.createElement("span");
  videoText.textContent="MP4: "+videoCount+" total · "+shareVideos+" shareable · "+(videoReady?"sharing ready":"sharing issue");
  videoText.className=videoReady?"good":"warn";
  $("deliverySummary").append(statusText,videoText);
  $("total").textContent=images.length+" bilder";
  $("status").textContent=images.length?"":"Ingen bilder funnet i mappen.";
  images.forEach((item,i)=>{
   const tile=document.createElement("button");tile.type="button";tile.className="tile";tile.setAttribute("aria-label","Åpne "+item.name);
   const img=document.createElement("img");img.src=item.url;img.alt=item.name;img.loading="lazy";
   const name=document.createElement("span");name.textContent=item.name;
   tile.append(img,name);tile.addEventListener("click",()=>open(i));$("grid").append(tile);
  });
  renderVideos();
  setTab(activeTab);
 };
 document.head.append(script);
}

function renderMedia(){
 const grid=$("mediaGrid");
 grid.replaceChildren();
 $("mediaStatus").textContent=mediaItems.length?"": "No media found. Add one direct image, GIF or video link per line in the Google Doc.";
 mediaItems.forEach((item,index)=>{
  const url=item.url;
  const card=document.createElement("article");
  card.className="media-card";
  const clean=url.split("?")[0].toLowerCase();
  const isVideo=/\.(mp4|webm|ogv|ogg|mov|m4v)$/.test(clean);
  const isImage=/\.(gif|png|jpe?g|webp|avif|bmp|svg)$/.test(clean);
  const addFallbackLink=()=>{
   if(card.querySelector("a"))return;
   const link=document.createElement("a");
   link.href=url;link.target="_blank";link.rel="noopener noreferrer";
   link.textContent="Could not embed this media — open link";
   card.insertBefore(link,card.firstChild);
  };
  if(isVideo){
   const video=document.createElement("video");
   video.src=url;video.controls=true;video.preload="metadata";video.playsInline=true;
   video.addEventListener("error",addFallbackLink,{once:true});
   card.append(video);
  }else{
   const img=document.createElement("img");
   img.src=url;img.alt="Media "+(index+1);img.loading="lazy";
   img.addEventListener("error",()=>{
    img.remove();
    if(isImage){addFallbackLink();return;}
    const video=document.createElement("video");
    video.src=url;video.controls=true;video.preload="metadata";video.playsInline=true;
    video.addEventListener("error",addFallbackLink,{once:true});
    card.insertBefore(video,card.firstChild);
   },{once:true});
   card.append(img);
  }
  const name=document.createElement("div");name.className="media-name";name.textContent="Item "+(index+1);card.append(name);
  grid.append(card);
 });
}
function renderVideos(){
 const grid=$("videoGrid");
 grid.replaceChildren();
 if(!videos.length){
  $("videoStatus").textContent="No MP4 videos found in the Google Drive Videos folder.";
  return;
 }
 $("videoStatus").textContent="Google Drive reports "+videos.length+" MP4 video(s). Sharing access is enabled, but Drive may still need time to process a newly uploaded video.";
 videos.forEach((item,index)=>{
  const card=document.createElement("article");
  card.className="media-card";
  const frame=document.createElement("iframe");
  frame.src=item.previewUrl||("https://drive.google.com/file/d/"+encodeURIComponent(item.id)+"/preview");
  frame.title=item.name||("Video "+(index+1));
  frame.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
  frame.allowFullscreen=true;
  frame.loading="eager";
  frame.referrerPolicy="strict-origin-when-cross-origin";
  frame.style.width="100%";
  frame.style.aspectRatio="16 / 9";
  frame.style.border="0";
  frame.style.borderRadius="9px";
  frame.style.background="#080a10";
  card.append(frame);
  const name=document.createElement("div");
  name.className="media-name";
  name.textContent=item.name||("Video "+(index+1));
  card.append(name);
  const actions=document.createElement("div");
  actions.className="video-actions";
  const openLink=document.createElement("a");
  openLink.href="https://drive.google.com/file/d/"+encodeURIComponent(item.id)+"/view";
  openLink.target="_blank";
  openLink.rel="noopener noreferrer";
  openLink.textContent="Open in Google Drive";
  actions.append(openLink);
  const directLink=document.createElement("a");
  directLink.href="https://drive.google.com/uc?export=download&id="+encodeURIComponent(item.id);
  directLink.target="_blank";
  directLink.rel="noopener noreferrer";
  directLink.textContent="Open direct MP4";
  actions.append(directLink);
  card.append(actions);
  grid.append(card);
 });
}
function setTab(tab){
 activeTab=tab;
 const imagesActive=tab==="images";
 $("imagesSection").classList.toggle("hidden-section",!imagesActive);
 $("videosSection").classList.toggle("hidden-section",tab!=="videos");
 $("imagesTab").classList.toggle("active",imagesActive);
 $("videosTab").classList.toggle("active",tab==="videos");
 $("randomImage").classList.toggle("hidden-section",!imagesActive);
 $("total").textContent=imagesActive?images.length+" bilder":videos.length+" MP4 videos";
 if(!imagesActive)close();
}

function open(i){if(!images.length)return;current=i;$("viewer").classList.remove("hidden");renderViewer()}
function renderViewer(){const item=images[current];$("big").src=item.url;$("big").alt=item.name;$("caption").textContent=item.name+" · "+(current+1)+" / "+images.length;$("prev").disabled=current===0;$("next").disabled=current===images.length-1}
function move(n){current=Math.max(0,Math.min(images.length-1,current+n));renderViewer()}
function close(){$("viewer").classList.add("hidden");$("big").removeAttribute("src")}
$("imagesTab").addEventListener("click",()=>setTab("images"));$("videosTab").addEventListener("click",()=>setTab("videos"));
$("hideImages").addEventListener("change",e=>{localStorage.setItem(HIDE_KEY,String(e.target.checked));document.body.classList.toggle("hide-images",e.target.checked)});$("loginForm").addEventListener("submit",e=>{e.preventDefault();const entered=$("password").value;crypto.subtle.digest("SHA-256",new TextEncoder().encode(entered.toLowerCase())).then(buffer=>{const hash=Array.from(new Uint8Array(buffer),b=>b.toString(16).padStart(2,"0")).join("");if(hash===PASSWORD_HASH){$("login").classList.add("hidden");$("password").value="";$("loginError").textContent="";load();}else{$("loginError").textContent="Wrong password";$("password").value="";$("password").focus();}}).catch(()=>$("loginError").textContent="Kunne ikke kontrollere passordet i denne nettleseren.");});$("close").addEventListener("click",close);$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));$("randomImage").addEventListener("click",()=>{if(!images.length)return;let next= Math.floor(Math.random()*images.length);if(images.length>1&&next===current)next=(next+1+Math.floor(Math.random()*(images.length-1)))%images.length;open(next)});
document.addEventListener("keydown",e=>{if($("viewer").classList.contains("hidden"))return;if(e.key==="Escape"){e.preventDefault();close()}else if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}else if(e.key==="ArrowRight"){e.preventDefault();move(1)}else if(e.key==="Home"){e.preventDefault();current=0;renderViewer()}else if(e.key==="End"){e.preventDefault();current=images.length-1;renderViewer()}});
let sx=0;$("viewer").addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});$("viewer").addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>55)move(dx<0?1:-1)},{passive:true});
function removeRefreshButtons(){document.querySelectorAll("button").forEach(button=>{const label=(button.textContent+" "+(button.getAttribute("aria-label")||"")+" "+button.id).trim();if(/oppdater|update|refresh/i.test(label))button.remove();});}
removeRefreshButtons();
new MutationObserver(removeRefreshButtons).observe(document.body,{childList:true,subtree:true});
applyHideSetting();
</script>
</body>
</html>
